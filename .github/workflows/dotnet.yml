name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The native FFTW library is not bundled with FFTW.NET (see README) and must be
      # installed separately. On Linux we install it so the DFT tests get real coverage
      # against the native library. On Windows there is no equivalent package manager
      # step, so those same tests are skipped there (FftwInterop.IsAvailable is false) -
      # Linux is what provides end-to-end native coverage in this workflow.
      - name: Install FFTW (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfftw3-double3 || sudo apt-get install -y libfftw3-3

      - name: Restore local .NET tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore FFTW.NET.slnx

      - name: Build
        run: dotnet build FFTW.NET.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test FFTW.NET.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
